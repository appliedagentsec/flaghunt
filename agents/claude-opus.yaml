# Uses your own ANTHROPIC_API_KEY (or `ant auth login`). Billed to your account.
name: claude-opus-5.5
provider: anthropic
model: claude-opus-5-5
effort: medium        # low | medium | high | xhigh | max
max_tokens: 16000
