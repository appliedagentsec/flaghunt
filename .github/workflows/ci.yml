name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Build sandbox image
        run: uv run flaghunt sandbox build
      - name: Run tests (including sandbox integration tests)
        run: uv run pytest -v
